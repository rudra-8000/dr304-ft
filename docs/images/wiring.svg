<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="980" height="520" fill="#fff"/>

  <!-- sensor -->
  <rect x="20" y="190" width="150" height="110" rx="10" fill="#fde2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="95" y="230" text-anchor="middle" font-weight="bold">6-axis F/T</text>
  <text x="95" y="250" text-anchor="middle">sensor</text>
  <text x="95" y="275" text-anchor="middle" font-size="12" fill="#555">(on robot wrist)</text>

  <!-- transmitter -->
  <rect x="300" y="150" width="210" height="200" rx="10" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <text x="405" y="180" text-anchor="middle" font-weight="bold">D.R304 transmitter</text>
  <text x="315" y="225" font-size="13">SENSOR in</text>
  <text x="495" y="215" text-anchor="end" font-size="13">+24V / 0V</text>
  <text x="495" y="265" text-anchor="end" font-size="13">RS485 A / B</text>
  <text x="495" y="320" text-anchor="end" font-size="13">Ethernet RJ45</text>

  <line x1="170" y1="245" x2="300" y2="225" stroke="#b91c1c" stroke-width="4"/>
  <text x="235" y="215" text-anchor="middle" font-size="12">sensor cable</text>
  <text x="235" y="270" text-anchor="middle" font-size="11" fill="#555">(factory connector)</text>

  <!-- PSU -->
  <rect x="610" y="20" width="160" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="690" y="50" text-anchor="middle" font-weight="bold">24 V DC PSU</text>
  <text x="690" y="72" text-anchor="middle" font-size="12">(see transmitter label)</text>
  <path d="M510,210 L570,210 L570,55 L610,55" fill="none" stroke="#dc2626" stroke-width="3"/>
  <path d="M510,220 L580,220 L580,75 L610,75" fill="none" stroke="#111" stroke-width="3"/>
  <text x="590" y="130" font-size="12" fill="#dc2626">red +24V</text>
  <text x="590" y="148" font-size="12">black 0V</text>

  <!-- USB-485 -->
  <rect x="610" y="215" width="160" height="80" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="690" y="243" text-anchor="middle" font-weight="bold">UT-891</text>
  <text x="690" y="262" text-anchor="middle" font-size="12">USB&#8596;RS485 (CP210x)</text>
  <text x="690" y="282" text-anchor="middle" font-size="12">T/R+ = A, T/R&#8722; = B</text>
  <line x1="510" y1="258" x2="610" y2="245" stroke="#ca8a04" stroke-width="3"/>
  <line x1="510" y1="270" x2="610" y2="268" stroke="#2563eb" stroke-width="3"/>
  <text x="560" y="238" text-anchor="middle" font-size="11" fill="#ca8a04">A (yellow)</text>
  <text x="560" y="290" text-anchor="middle" font-size="11" fill="#2563eb">B (blue)</text>

  <!-- switch -->
  <rect x="610" y="380" width="160" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="690" y="407" text-anchor="middle" font-weight="bold">Ethernet switch</text>
  <text x="690" y="426" text-anchor="middle" font-size="12">(or direct to PC)</text>
  <path d="M510,320 L560,320 L560,410 L610,410" fill="none" stroke="#15803d" stroke-width="3"/>

  <!-- PC -->
  <rect x="840" y="200" width="125" height="230" rx="10" fill="#f3f4f6" stroke="#111" stroke-width="2"/>
  <text x="902" y="235" text-anchor="middle" font-weight="bold">Robot PC</text>
  <text x="902" y="255" text-anchor="middle" font-size="12">Ubuntu 22.04</text>
  <text x="902" y="300" text-anchor="middle" font-size="12">USB &#8594; /dev/dr304</text>
  <text x="902" y="405" text-anchor="middle" font-size="12">PC NIC</text>
  <line x1="770" y1="255" x2="840" y2="295" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
  <line x1="770" y1="410" x2="840" y2="400" stroke="#15803d" stroke-width="3" marker-end="url(#a)"/>

  <text x="20" y="470" font-size="13" font-weight="bold">RS485 (USB):</text>
  <text x="125" y="470" font-size="13">one-time configuration (IP, protocol, rate); can also stream data (Modbus RTU, 115200 baud)</text>
  <text x="20" y="495" font-size="13" font-weight="bold">Ethernet:</text>
  <text x="125" y="495" font-size="13">recommended for rollouts - Modbus TCP, port 502, 30/60/120 Hz polling</text>
</svg>
